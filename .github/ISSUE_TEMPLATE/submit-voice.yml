name: Submit a voice
description: Share a voice for Blip with everyone
title: "Voice: "
labels: ["voice"]
body:
  - type: markdown
    attributes:
      value: |
        One short sound, under half a second: Blip plays it on every letter and changes its pitch itself.
        Any audio file works (`.wav`, `.mp3`, `.m4a`, `.ogg`, `.flac`…): zip it and drop the zip in the **Sound** field. A short `.mp4` or `.mov` works too, as is. Once approved, your voice shows on [blip.ivwi.fr](https://blip.ivwi.fr) and in everyone's `/blip voice` menu.
  - type: input
    id: name
    attributes:
      label: Voice name
      description: 2 to 20 lowercase letters, digits or dashes. People will type `/blip voice <name>`.
      placeholder: bloop
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      description: A few words, 60 characters at most.
      placeholder: a wet little bloop
    validations:
      required: true
  - type: textarea
    id: sound
    attributes:
      label: Sound
      description: Drag your zipped sound here (or a short `.mp4` / `.mov`).
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: I made this sound myself, or it is in the public domain, and I share it under CC0.
          required: true
        - label: It is not taken from a game, a film, a show or a song.
          required: true
