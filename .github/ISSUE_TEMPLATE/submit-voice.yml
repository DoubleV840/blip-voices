name: Submit a voice
description: Share a voice for Blip with everyone
title: "Voice: "
labels: ["voice"]
body:
  - type: markdown
    attributes:
      value: |
        One short sound, under half a second: Blip plays it on every letter and changes its pitch itself.
        Sounds only, no videos. A `.mp3` or a `.wav` goes as it is in the **Sound** field. Any other sound (`.m4a`, `.ogg`, `.flac`, `.aiff`…): drop it on [blip.ivwi.fr](https://blip.ivwi.fr/#share) first, which turns it into a `.wav` and plays it as Blip will.
        It is checked automatically and, if it passes, goes live within minutes on [blip.ivwi.fr](https://blip.ivwi.fr) and in everyone's `/blip voice` menu.
        Shared from a GitHub account at least a week old, three voices a day at most. A voice three people report is removed.
  - type: input
    id: name
    attributes:
      label: Voice name
      description: 2 to 20 letters, digits or dashes, like `cat-meow`. People will type `/blip voice <name>`.
      placeholder: bloop
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - retro
        - cute
        - soft
        - machine
        - creature
        - dark
        - weird
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      description: A few words, 60 characters at most.
      placeholder: a wet little bloop
    validations:
      required: true
  - type: textarea
    id: sound
    attributes:
      label: Sound
      description: Drag your `.mp3` or `.wav` here.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: I made this sound myself, or it is in the public domain, and I share it under CC0.
          required: true
        - label: It is not taken from a game, a film, a show or a song.
          required: true
        - label: Nothing in it, its name or its description is offensive.
          required: true
