# Removes a community voice: from the site, from the menu, and from every
# machine that installed it the next time Blip reads the catalog.
# Run it from the Actions tab: Remove a voice → Run workflow.
name: Remove a voice

on:
  workflow_dispatch:
    inputs:
      name:
        description: The voice to remove
        required: true

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove it
        id: remove
        env:
          NAME: ${{ inputs.name }}
        run: python3 scripts/add_voice.py --remove "$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          NAME: ${{ steps.remove.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A voices catalog.json removed.json
          git commit -m "Remove voice $NAME"
          git push
